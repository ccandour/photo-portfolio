# Docker Compose Configuration

version: '3'
services:
  app:
    build: .
    ports:
      - "3000:3000"
    restart: unless-stopped
    environment:
      - DATA_DIR=/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./static/photos:/app/static/photos
      - ./static/responsive:/app/static/responsive
      - ./data:/app/data
