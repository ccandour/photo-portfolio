# Docker Compose Configuration

version: '3'
services:
  app:
    build: .
    ports:
      - "3000:3000"
    restart: unless-stopped
    environment:
      - DATA_DIR=/app/data
      # Admin panel (values come from .env, see .env.example)
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - ORIGIN=${ORIGIN:?Set ORIGIN in .env to the public site URL}
      # Max request body in bytes (adapter-node default is 512 KB; photos are uploaded one per request)
      - BODY_SIZE_LIMIT=73400320
      # Uncomment ONLY if a reverse proxy (nginx, Caddy, Traefik...) sits in front and sets X-Forwarded-For.
      # Gives login rate limiting the real client IP; without a proxy the header could be spoofed.
      # - ADDRESS_HEADER=X-Forwarded-For
      # - XFF_DEPTH=1
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./static/photos:/app/static/photos
      - ./static/responsive:/app/static/responsive
      - ./data:/app/data
